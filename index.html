<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RFQ Copilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202c; --muted:#5d6b7a; --line:#d9dfe6; --bg:#f4f6f8; --card:#fff;
  --accent:#0b6b5c; --accent-soft:#e3f3ef; --warn:#a5560a; --warn-soft:#fdf0e1; --bad:#b3261e;
}
@media (prefers-color-scheme:dark){
  :root{--ink:#e6ebf0; --muted:#9aa8b6; --line:#2c3947; --bg:#0f161d; --card:#17212b;
        --accent:#4fd1b6; --accent-soft:#12332d; --warn:#f0b36a; --warn-soft:#33260f; --bad:#ff8a80;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Public Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;
     padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
header h1{font-size:28px;margin:0 0 4px;letter-spacing:-.02em}
header p{margin:0;color:var(--muted);max-width:60ch}
.badge{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-left:8px;vertical-align:middle}
.badge.ai{color:var(--accent);border-color:var(--accent)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:20px}
.panel h2{font-size:16px;margin:0 0 12px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:end}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
input[type=number]{width:140px} select{min-width:200px}
textarea{width:100%;min-height:130px;resize:vertical;font-size:14px}
textarea:focus,input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.quotes{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}
.qcard{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--card)}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600;font-size:14px}
.qhead span{display:flex;gap:10px;align-items:center;font-weight:400}
.link{background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;font-size:13px;padding:0}
.link.danger{color:var(--bad)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
button.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:6px;border:1px solid var(--accent);cursor:pointer;background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.btn{color:#08201b}}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.6;cursor:wait}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--bad);margin-top:10px;font-size:14px}
.verdict{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:16px 18px;font-size:16px}
.tablewrap{overflow-x:auto;margin-top:16px}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:13px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.best td{background:var(--accent-soft);font-weight:600}
.bar{display:inline-block;width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;vertical-align:middle;margin-right:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.flags{margin:14px 0 0;padding:12px 14px;background:var(--warn-soft);color:var(--warn);border-radius:8px;font-size:14px}
.flags ul{margin:6px 0 0;padding-left:18px}
pre.email{white-space:pre-wrap;font:inherit;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;margin:0}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>RFQ Copilot <span id="mode" class="badge">checking…</span></h1>
    <p>Paste or upload supplier quotes. Get one comparison table, a recommended supplier with reasons, and a ready-to-send reply email.</p>
  </header>

  <section class="panel">
    <h2>What do you need to buy?</h2>
    <div class="row">
      <div><label for="qty">Quantity (units)</label><input id="qty" type="number" min="1" value="500"></div>
      <div><label for="prio">What matters most?</label>
        <select id="prio">
          <option value="balanced">Balanced: cost, speed, payment terms</option>
          <option value="cost">Lowest cost</option>
          <option value="speed">Fastest delivery</option>
        </select></div>
    </div>
  </section>

  <section class="panel">
    <h2>Supplier quotes</h2>
    <div id="quotes" class="quotes"></div>
    <div class="actions">
      <button class="btn ghost" id="add">Add supplier</button>
      <button class="btn ghost" id="sample">Load sample quotes</button>
      <button class="btn" id="go">Compare quotes</button>
    </div>
    <div id="err" class="err hidden" role="alert"></div>
  </section>

  <div id="results" class="hidden">
    <section class="panel">
      <h2>Recommendation</h2>
      <div class="verdict" id="summary"></div>
      <div id="flagbox"></div>
      <div class="tablewrap"><table>
        <thead><tr><th>Supplier</th><th class="num">Unit price</th><th class="num">Total</th><th class="num">Delivery</th><th class="num">Payment</th><th class="num">MOQ</th><th>Score</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table></div>
    </section>
    <section class="panel">
      <h2>Draft reply to the recommended supplier</h2>
      <pre class="email" id="email"></pre>
      <div class="actions"><button class="btn ghost" id="copy">Copy email</button></div>
    </section>
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const quotesEl = $("#quotes");
let count = 0;

function addQuote(text = "") {
  count++;
  const id = "q" + count;
  const card = document.createElement("div");
  card.className = "qcard";
  card.innerHTML = `
    <div class="qhead">Quote
      <span>
        <button class="link" data-act="upload">Upload PDF/txt</button>
        <button class="link danger" data-act="remove">Remove</button>
      </span>
    </div>
    <textarea id="${id}" placeholder="Paste the supplier's email or quotation text here"></textarea>
    <input type="file" accept=".pdf,.txt" class="hidden">`;
  card.querySelector("textarea").value = text;
  const file = card.querySelector("input[type=file]");
  card.addEventListener("click", (e) => {
    const act = e.target.dataset && e.target.dataset.act;
    if (act === "remove") card.remove();
    if (act === "upload") file.click();
  });
  file.addEventListener("change", async () => {
    if (!file.files[0]) return;
    const fd = new FormData(); fd.append("file", file.files[0]);
    try {
      const r = await fetch("/api/extract-text", { method: "POST", body: fd });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || "Could not read file");
      card.querySelector("textarea").value = j.text;
    } catch (e) { showErr(e.message); }
  });
  quotesEl.appendChild(card);
}

function showErr(m) { const e = $("#err"); e.textContent = m; e.classList.toggle("hidden", !m); }
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const money = (c, v) => v == null ? "–" : c + Number(v).toLocaleString("en-IN", { maximumFractionDigits: v >= 100 ? 0 : 2 });

$("#add").onclick = () => addQuote();
$("#sample").onclick = async () => {
  const s = await (await fetch("/api/samples")).json();
  quotesEl.innerHTML = ""; s.forEach(addQuote);
};

$("#go").onclick = async () => {
  showErr("");
  const texts = [...quotesEl.querySelectorAll("textarea")].map((t) => t.value.trim()).filter(Boolean);
  const quantity = parseInt($("#qty").value, 10);
  if (!quantity || quantity < 1) return showErr("Enter a quantity of 1 or more.");
  if (texts.length < 2) return showErr("Add at least two supplier quotes to compare.");
  const btn = $("#go"); btn.disabled = true; btn.textContent = "Comparing…";
  try {
    const r = await fetch("/api/analyze", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ quantity, priority: $("#prio").value, quotes: texts.map((text) => ({ text })) }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "Something went wrong. Check your quotes and try again.");
    render(j);
  } catch (e) { showErr(e.message); }
  btn.disabled = false; btn.textContent = "Compare quotes";
};

function render(d) {
  $("#results").classList.remove("hidden");
  $("#summary").textContent = d.summary;
  const flagged = d.rows.filter((r) => r.flags.length);
  $("#flagbox").innerHTML = flagged.length
    ? `<div class="flags"><strong>Missing or risky details</strong><ul>${flagged.map((r) => `<li>${esc(r.supplier)}: ${r.flags.map(esc).join("; ")}</li>`).join("")}</ul></div>` : "";
  $("#tbody").innerHTML = d.rows.map((r) => {
    const c = r.currency || "₹";
    return `<tr class="${r.supplier === d.best ? "best" : ""}">
      <td>${esc(r.supplier)}</td>
      <td class="num">${money(c, r.unit_price)}</td>
      <td class="num">${money(c, r.total)}</td>
      <td class="num">${r.delivery_days == null ? "–" : r.delivery_days + " days"}</td>
      <td class="num">${r.payment_days == null ? "–" : r.payment_days === 0 ? "Advance" : "Net " + r.payment_days}</td>
      <td class="num">${r.moq == null ? "–" : r.moq.toLocaleString("en-IN")}</td>
      <td><span class="bar"><i style="width:${Math.min(r.score, 100)}%"></i></span>${r.score}</td></tr>`;
  }).join("");
  $("#email").textContent = d.email;
  const m = $("#mode"); m.textContent = d.mode === "ai" ? "AI extraction" : "Rule-based extraction";
  m.classList.toggle("ai", d.mode === "ai");
  $("#results").scrollIntoView({ behavior: "smooth" });
}

$("#copy").onclick = async () => {
  await navigator.clipboard.writeText($("#email").textContent);
  $("#copy").textContent = "Copied"; setTimeout(() => ($("#copy").textContent = "Copy email"), 1500);
};

fetch("/api/health").then((r) => r.json()).then((h) => {
  const m = $("#mode"); m.textContent = h.ai_enabled ? "AI extraction on" : "Rule-based mode";
  m.classList.toggle("ai", h.ai_enabled);
});
addQuote(); addQuote();
</script>
</body>
</html>
